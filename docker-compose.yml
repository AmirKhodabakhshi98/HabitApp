services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: habitapp
      POSTGRES_USER: habit
      POSTGRES_PASSWORD: habit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habit -d habitapp"]
      interval: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/habitapp
      SPRING_DATASOURCE_USERNAME: habit
      SPRING_DATASOURCE_PASSWORD: habit
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: